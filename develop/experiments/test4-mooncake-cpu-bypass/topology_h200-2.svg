<rect x="92" y="817" width="20" height="16" rx="3" fill="#94a3b8"/>
<text x="120" y="830" font-size="13" fill="#f1f5f9" text-anchor="start" font-weight="bold" font-family="MergedCJKLatin">NODE</text>
<text x="180" y="830" font-size="13" fill="#cbd5e1" text-anchor="start" font-weight="normal" font-family="MergedCJKLatin">同 NUMA 内跨 PCIe host bridge(如 GPU0↔mlx5_1)</text>
<rect x="92" y="844" width="20" height="16" rx="3" fill="#f59e0b"/>
<text x="120" y="857" font-size="13" fill="#f1f5f9" text-anchor="start" font-weight="bold" font-family="MergedCJKLatin">SYS</text>
<text x="180" y="857" font-size="13" fill="#cbd5e1" text-anchor="start" font-weight="normal" font-family="MergedCJKLatin">跨 NUMA,经 UPI(如 GPU0↔GPU4 的 PCIe 路径 / mlx5_bond_0↔GPU0-3)</text>
<text x="90" y="888" font-size="13" fill="#a7f3d0" text-anchor="start" font-weight="normal" font-family="MergedCJKLatin">对 PD 实验的意义:P(GPU0-3)↔D(GPU4-7)的 KV 传输——nixl 用 UCX cuda_ipc 走 NVLink(NV18,免网卡);</text>
<text x="90" y="908" font-size="13" fill="#a7f3d0" text-anchor="start" font-weight="normal" font-family="MergedCJKLatin">mooncake TransferEngine 仅 rdma/tcp,须经 ConnectX NIC(单机回环)且需 RoCEv2 GID,故单机 PD 不占 NVLink 优势。</text>
</svg>