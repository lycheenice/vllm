# mkdocs configuration for the vLLM framework wiki.
#
# This is a self-contained mkdocs project rooted at develop/wiki/.
# Serve locally:
#   pip install -r develop/wiki/requirements-mkdocs.txt
#   mkdocs serve -f develop/wiki/mkdocs.yml
#
# The nav tree below is generated from the directory structure; regenerate
# with:
#   python3 develop/wiki/_build_nav.py --full > develop/wiki/mkdocs.yml

site_name: vLLM 框架 Wiki
site_description: 系统性拆解 vLLM 框架的中文 Wiki（子系统 → 子模块 五段式）
site_url: ""
repo_url: https://github.com/lycheenice/vllm
repo_branch: v0.25.0
edit_uri: edit/v0.25.0/develop/wiki/
docs_dir: .

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.prune
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 自动切换主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-2
        name: 切换至亮色
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - ja
  - autorefs

markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lycheenice/vllm

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js


